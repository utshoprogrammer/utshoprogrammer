name: Update CP Avatars

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch: {}     # allows manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  update-avatars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch avatars
        run: python scripts/fetch_avatars.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cf_avatar.png assets/lc_avatar.png assets/cf_card.svg
          git diff --cached --quiet || git commit -m "chore: auto-update CP avatars"
          git push

      - name: Purge jsDelivr cache for cf_card.svg
        run: |
          curl -s "https://purge.jsdelivr.net/gh/habibprogrammerbd/habibprogrammerbd@main/assets/cf_card.svg" || true
